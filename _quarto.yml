project:
  type: website
  output-dir: docs
  post-render:
    - "touch docs/.nojekyll"

website:
  title: "Anindya Saha"
  site-url: https://anindya-saha.github.io
  navbar:
    background: light
    foreground: dark
    left:
      - text: "Blog"
        href: index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/anindya-saha
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/anindyacs/
        target: _blank
  page-footer:
    left: "&copy; 2026 Anindya Saha"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    mainfont: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
