[project]
name = "anindya-saha-blog"
version = "0.0.1"
description = "Personal blog powered by Quarto and Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "matplotlib>=3.10.7",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "jupyterlab>=4.0.0",
    "nbformat>=5.0.0",
    "nbclient>=0.10.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
